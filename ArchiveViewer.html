<!doctype html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- KaTeX (MathJax 대체: 렌더링 속도 개선) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css" crossorigin="anonymous" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>

  <style>
    :root { --bd:#e8e8e8; --bg:#fff; --muted: rgba(0,0,0,.65); }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #fff; }

    header {
      height: 54px;
      box-sizing: border-box;
      position: sticky; top: 0; z-index: 10;
      display: flex; gap: 10px; align-items: center;
      padding: 10px 12px; border-bottom: 1px solid var(--bd); background: var(--bg);
    }
    .meta { font-size: 14px; color: rgba(0,0,0,.75); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .pill { padding: 3px 8px; border: 1px solid #eee; border-radius: 999px; font-size: 12px; color: rgba(0,0,0,.7); }
    .spacer { flex: 1; }
    button { border: 1px solid #ddd; background: #fff; padding: 6px 10px; border-radius: 10px; cursor: pointer; }
    button:hover { background: #f7f7f7; }

    .wrap {
      height: calc(100vh - 54px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }

    .pane {
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      border-right: 1px solid var(--bd);
    }
    .pane:last-child { border-right: none; }

    .paneHead {
      padding: 10px 12px;
      border-bottom: 1px solid var(--bd);
      background: #fafafa;
      display: flex; align-items: center; gap: 10px;
      flex: 0 0 auto;
    }
    .paneTitle { font-weight: 650; }
    .paneSub { font-size: 12px; color: var(--muted); }

    .scroll { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 14px; }

    .list { border: 1px solid #e5e5e5; border-radius: 14px; background: #fff; overflow: hidden; }
    .item { padding: 12px 12px; }
    .item + .item { border-top: 1px dashed #eee; }

    .itemHead { display:flex; gap:10px; align-items:baseline; margin-bottom: 8px; flex-wrap: wrap; }
    .itemRow { font-size: 12px; opacity: .6; }
    .itemId  { font-size: 20px; font-weight: 700; opacity: .85; }

    /* 좌측: Latex 박스 */
    .leftTop {
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 12px;
      line-height: 2.0;
      font-size: 20px;
      word-break: break-word;
      background: #fff;
    }

    /* 우측: LLM 결과 박스 */
    .rightBody {
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 12px;
      line-height: 2.0;
      font-size: 20px;
      word-break: break-word;
      background: #fff;
    }
    .rightBody + .rightBody { margin-top: 10px; }

    .llmLabel {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      color: #fff;
    }
    .llmLabel.claude { background: #d97706; }
    .llmLabel.gpt    { background: #10a37f; }
    .llmLabel.merged { background: #7c3aed; }
    .llmLabel.gemini  { background: #4285f4; }
    .op { padding: 6px 0; }
    .op + .op { border-top: 1px dashed #d1d5db; margin-top: 6px; }
    .fb { margin-top: 6px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .fb button { font-size: 12px; padding: 3px 10px; border: 1px solid #9ca3af; border-radius: 6px; background: #fff; cursor: pointer; }
    .fb button.on.acc { background: #16a34a; border-color: #16a34a; color: #fff; }
    .fb button.on.rej { background: #dc2626; border-color: #dc2626; color: #fff; }
    .fb button:disabled { opacity: .5; cursor: default; }
    .fb input { font-size: 12px; padding: 3px 6px; border: 1px solid #d1d5db; border-radius: 6px; flex: 1; min-width: 120px; }
    .fb .fbMsg { font-size: 11px; color: #6b7280; }
    .llmLabel.old    { background: #6b7280; }  /* 2026-10-02 D23: 863행 이전 옛 배치(열 이름 그대로) */

    .rightBody a {
      text-decoration: underline;
      color: inherit;
    }

    .empty { padding: 14px; color: rgba(0,0,0,.6); }
  </style>
</head>

<body>
  <header>
    <div class="meta">
      <span class="mono" id="sheet"></span>
      <span class="pill" id="info" style="margin-left:8px; display:none;"></span>
    </div>
    <div class="spacer"></div>
    <button onclick="poll(true)">새로고침</button>
  </header>

  <div class="wrap">
    <!-- LEFT -->
    <section class="pane">
      <div class="paneHead">
        <div class="paneTitle">문항 (Latex)</div>
        <div class="paneSub mono" id="leftSub"></div>
      </div>
      <div class="scroll">
        <div id="leftList" class="list"></div>
      </div>
    </section>

    <!-- RIGHT -->
    <section class="pane">
      <div class="paneHead">
        <div class="paneTitle">윤문 결과</div>
        <div class="paneSub" id="rightSub"></div>
      </div>
      <div class="scroll">
        <div id="rightList" class="list"></div>
      </div>
    </section>
  </div>

  <script>
    let lastSig = '';

    function escapeHtml(s) {
      return String(s ?? '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;');
    }

    // KaTeX 공통 옵션 및 렌더 헬퍼
    const KATEX_OPTS = {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '\\[', right: '\\]', display: true },
        { left: '\\(', right: '\\)', display: false },
        { left: '$', right: '$', display: false }
      ],
      throwOnError: false,
      errorColor: '#c00',
      ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
    };

    function typesetAll() {
      const targets = [document.getElementById('leftList'), document.getElementById('rightList')];
      if (!window.renderMathInElement) { setTimeout(typesetAll, 150); return; }
      targets.forEach(el => { if (el) renderMathInElement(el, KATEX_OPTS); });
    }

    let FB = {};                                   // 의견ID → {verdict, memo, applied}

    function fbControls(id) {
      const f = FB[id] || {};
      const dis = f.applied ? 'disabled' : '';
      return `
        <div class="fb" data-id="${escapeHtml(id)}">
          <button class="acc ${f.verdict === '채택' ? 'on' : ''}" ${dis} onclick="fbClick(this,'채택')">채택</button>
          <button class="rej ${f.verdict === '기각' ? 'on' : ''}" ${dis} onclick="fbClick(this,'기각')">기각</button>
          <input type="text" placeholder="메모(선택)" value="${escapeHtml(f.memo || '').replace(/"/g, '&quot;')}" ${dis} onchange="fbMemo(this)">
          <span class="fbMsg">${f.applied ? '반영됨: ' + escapeHtml(f.applied) : ''}</span>
        </div>
      `;
    }

    // ── 기출 사례 보기: [[사례]] 줄(문항ID 목록)을 새 탭 링크로 바꾼다 (kice-2.0.3, RefViewer) ──
    let REFS = { url: '', t: '' };
    function refsUnesc(s) { return String(s).replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#x27;/g, "'").replace(/&amp;/g, '&'); }
    function refsLink(part) {
      return String(part).replace(/\[\[사례\]\][ \t]*([^<\n]*)/, (all, body) => {
        const ids = body.match(/\d{4}-\d{2}-[A-Za-z]+-\d+/g) || [];
        if (!ids.length) return all;
        const more = (body.match(/\(외 \d+\)/) || [''])[0];
        if (!REFS.url) return `[[사례]] 기출 ${ids.length}문항 ${more}`;
        const groups = [], at = {};                       // 주소를 줄인다: 2025-09-C.11.15~2025-06-P.27
        ids.forEach(id => { const k = id.lastIndexOf('-'), p = id.slice(0, k); if (!(p in at)) { at[p] = groups.length; groups.push([p]); } groups[at[p]].push(id.slice(k + 1)); });
        const m = String(part).match(/\[\[수정\]\][ \t]*([^<\n]*)/);
        const href = REFS.url + (REFS.url.indexOf('?') < 0 ? '?' : '&') + 'view=refs&t=' + encodeURIComponent(REFS.t) + '&ids=' + groups.map(g => g.join('.')).join('~')
          + '&q=' + encodeURIComponent(m ? refsUnesc(m[1]).slice(0, 80) : '');
        return `[[사례]] <a class="refs" href="${href}" target="_blank" rel="noopener">기출 ${ids.length}문항 보기</a> ${more}`;
      });
    }

    // v2 셀: 의견은 <br><br> 로 나뉘고 저마다 [[ID]] 줄이 있다. 의견마다 채택/기각을 붙인다.
    function withFeedback(html) {
      return String(html).split('<br><br>').map(part => {
        const m = part.match(/\[\[ID\]\]\s*([^<\n]+)/);
        return `<div class="op">${refsLink(part)}${m ? fbControls(m[1].trim()) : ''}</div>`;
      }).join('');
    }

    function fbSync(id) {                          // 같은 의견이 E·F·G 에 함께 보일 수 있다 — 모두 맞춘다
      const f = FB[id] || {};
      document.querySelectorAll('.fb').forEach(el => {
        if (el.dataset.id !== id) return;
        el.querySelector('.acc').classList.toggle('on', f.verdict === '채택');
        el.querySelector('.rej').classList.toggle('on', f.verdict === '기각');
        el.querySelector('input').value = f.memo || '';
      });
    }

    function fbSend(el, verdict, memo) {
      const box = el.closest('.fb'), id = box.dataset.id, msg = box.querySelector('.fbMsg');
      msg.textContent = '기록 중…';
      google.script.run
        .withSuccessHandler(r => {
          if (!r || !r.ok) { msg.textContent = '실패: ' + ((r && r.reason) || '?'); return; }
          FB[id] = Object.assign({}, FB[id], { verdict: r.verdict, memo: r.memo });
          fbSync(id);
          msg.textContent = r.verdict ? '기록됨' : '판정 취소';
        })
        .withFailureHandler(e => { msg.textContent = '실패: ' + (e && e.message || e); })
        .qv_setFeedback(id, verdict, memo);
    }

    function fbClick(btn, verdict) {               // 켜진 버튼을 다시 누르면 판정 취소
      const box = btn.closest('.fb');
      fbSend(btn, btn.classList.contains('on') ? '' : verdict, box.querySelector('input').value);
    }

    function fbMemo(input) {
      const box = input.closest('.fb');
      const f = FB[box.dataset.id] || {};
      fbSend(input, f.verdict || '', input.value);
    }

    function renderLlmBlock(label, cssClass, html, v2) {
      if (!html) return '';
      return `
        <div class="rightBody">
          <div><span class="llmLabel ${cssClass}">${label}</span></div>
          <div>${v2 ? withFeedback(html) : html}</div>
        </div>
      `;
    }

    function render(payload) {
      if (!payload) return;
      const sig = payload.signature || '';
      if (sig === lastSig) return;
      lastSig = sig;

      document.getElementById('sheet').textContent = payload.sheetName || '아카이브';
      const info = document.getElementById('info');
      info.style.display = 'inline-block';
      info.textContent = `범위 ${payload.range?.startRow ?? '?'}-${payload.range?.endRow ?? '?'} · ${payload.count ?? 0}개`;

      document.getElementById('leftSub').textContent = 'A(id), B(Latex)';
      document.getElementById('rightSub').textContent = payload.switchRow2
        ? `E(Claude) / F(${payload.switchRow2}행부터 합의, 그 전은 GPT) / G(Gemini) · 863행 이전은 열 그대로`
        : 'E(Claude) / F(GPT) / G(Gemini) · 863행 이전은 열 그대로';

      const items = payload.items || [];
      FB = payload.feedback || {};
      if (payload.refs && payload.refs.url) REFS = payload.refs;

      if (!items.length) {
        document.getElementById('leftList').innerHTML = `<div class="empty">(출력할 행이 없음)</div>`;
        document.getElementById('rightList').innerHTML = `<div class="empty">(출력할 행이 없음)</div>`;
        return;
      }

      // LEFT: id 헤더 + Latex만 (id 중복 제거)
      const leftHtml = items.map(it => {
        const idLine = escapeHtml(it.id || '(id 없음)');
        const latex = escapeHtml(it.latex || '').replace(/\n/g,'<br>');
        return `
          <div class="item">
            <div class="itemHead">
              <span class="itemRow">row ${it.row}</span>
              <span class="itemId">${idLine}</span>
            </div>
            <div class="leftTop">
              <div>${latex || '(Latex 빈값)'}</div>
            </div>
          </div>
        `;
      }).join('');

      // RIGHT: Claude, GPT, Gemini 순차
      const rightHtml = items.map(it => {
        const idLine = escapeHtml(it.id || '(id 없음)');
        const blocks = (Array.isArray(it.blocks)                     // 2026-10-02 D23: 행별 blocks 우선
          ? it.blocks.map(b => renderLlmBlock(b.label, b.cls, b.html, it.layout === 'v2'))
          : [
              renderLlmBlock('Claude', 'claude', it.claude),
              renderLlmBlock('GPT', 'gpt', it.gpt),
              renderLlmBlock('Gemini', 'gemini', it.gemini)
            ]).join('');
        return `
          <div class="item">
            <div class="itemHead">
              <span class="itemRow">row ${it.row}</span>
              <span class="itemId">${idLine}</span>
            </div>
            ${blocks || '<div class="rightBody">(윤문 결과 없음)</div>'}
          </div>
        `;
      }).join('');

      document.getElementById('leftList').innerHTML = leftHtml;
      document.getElementById('rightList').innerHTML = rightHtml;

      typesetAll();
    }

    function poll(force=false) {
      google.script.run
        .withSuccessHandler((payload) => {
          if (force) lastSig = '';
          render(payload);
        })
        .qv_getPayload();
    }

    poll(true);
    setInterval(() => poll(false), 700);
  </script>
</body>
</html>
